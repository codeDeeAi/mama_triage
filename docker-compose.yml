

services:
  postgres:
    image: postgres:16-alpine
    container_name: mama-triage-pg
    environment:
      POSTGRES_USER: mama
      POSTGRES_PASSWORD: mama
      POSTGRES_DB: mama_triage
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mama -d mama_triage']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
