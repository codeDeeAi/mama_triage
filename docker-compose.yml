

# Local development database.
#
# Pinned to the same major version as the deployed server (PostgreSQL 18). Developing
# against 16 and deploying to 18 invites a difference that only shows up in production.
services:
  postgres:
    image: postgres:18-alpine
    container_name: mama-triage-pg
    environment:
      POSTGRES_USER: mama
      POSTGRES_PASSWORD: mama
      POSTGRES_DB: mama_triage
    ports:
      - '5433:5432'
    volumes:
      # PG18 wants the mount here, not at /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mama -d mama_triage']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
