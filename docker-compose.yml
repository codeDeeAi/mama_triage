# Local development dependencies. Production uses Cloud SQL (Postgres 16) and an
# in-image Chroma index; see IMPLEMENTATION_PLAN.md section 15.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mama-triage-pg
    environment:
      POSTGRES_USER: mama
      POSTGRES_PASSWORD: mama
      POSTGRES_DB: mama_triage
    # Host port 5433: 5432 is commonly already taken by another local Postgres.
    # Container-internal port stays 5432.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mama -d mama_triage']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
