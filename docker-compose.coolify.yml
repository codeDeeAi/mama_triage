
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # No build args on purpose. Coolify rewrites them into bare `--build-arg NAME`,
      # which blanks whatever is set here. The index is built on first boot instead —
      # see BUILD_INDEX_ON_BOOT below.
    environment:
      - SERVICE_FQDN_APP_8080
      - NODE_ENV=production
      - PORT=8080

      - DATABASE_URL=postgres://mama:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/mama_triage
      - RUN_MIGRATIONS_ON_BOOT=true

      # Embeds the corpus on first boot, then only when it or the model changes.
      # Boot fails loudly rather than serving without an index.
      - BUILD_INDEX_ON_BOOT=true
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-voyage-3}

      # Must stay stable for the life of the deployment: identity is an HMAC keyed on
      # this, so changing it makes every registered mother unrecognisable.
      - PHONE_HASH_PEPPER=${SERVICE_BASE64_64_PEPPER}

      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}

      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_WEBHOOK_SECRET=${SERVICE_PASSWORD_TELEGRAMWEBHOOK}

      # All four or none — config refuses to start on a partial group.
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}

      - KUDISMS_TOKEN=${KUDISMS_TOKEN}
      - KUDISMS_SENDER_ID=${KUDISMS_SENDER_ID}

      - ADMIN_TOKEN=${SERVICE_PASSWORD_ADMIN}
      - STUDY_NAME=${STUDY_NAME:-the MIVA maternal health study}

      # An unauthenticated chat interface onto the triage engine. Leave off.
      - DEMO_ENABLED=${DEMO_ENABLED:-false}
    volumes:
      # Survives redeploys, so the corpus is embedded once rather than per deploy.
      - knowledge-index:/app/knowledge/index
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=mama
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=mama_triage
    volumes:
      # PG18 wants the mount here, not at /var/lib/postgresql/data.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mama -d mama_triage']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No `ports:` on purpose — reachable from `app` over the Docker network and nowhere
    # else, so nothing crosses the public internet.

volumes:
  pg-data:
  knowledge-index:
